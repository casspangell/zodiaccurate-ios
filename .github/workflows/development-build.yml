name: Development Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

jobs:
  development-build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
        
    - name: Cache CocoaPods
      uses: actions/cache@v3
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-
          
    - name: Install CocoaPods
      run: |
        pod install --repo-update
        
    - name: Build for Development
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
        BUILD_ENVIRONMENT: ${{ github.event.inputs.environment }}
      run: |
        echo "Building for environment: $BUILD_ENVIRONMENT"
        xcodebuild -workspace Zodiaccurate.xcworkspace \
                   -scheme Zodiaccurate \
                   -destination 'platform=iOS Simulator,name=iPhone 16' \
                   build
                   
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ios-build-${{ github.event.inputs.environment }}
        path: |
          build/
          *.ipa
        retention-days: 7 